<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리동네 이웃살핌</title>
<meta name="description" content="혼자 계신 이웃이 걱정될 때, 길음종합사회복지관 마을동행팀에 알리는 곳">
<meta name="theme-color" content="#2E6B4E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="이웃살핌">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
:root{
  --ink:#1B2A22; --pine:#2E6B4E; --pine-dark:#204C38;
  --mist:#EEF4EF; --paper:#FFFFFF; --persimmon:#B8541F;
  --stone:#77837C; --line:#DCE3DD; --step:0px;
  /* 그림에 쓰는 부드러운 색 */
  --t-green:#DCEBE0; --t-sand:#F7E7CE; --t-sky:#DCE7F2; --t-rose:#F6DFD4;
  --f-green:#9DC9A9; --f-sand:#E8C58A; --f-sky:#A8C4E0; --f-rose:#E3AE94;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  font-size:calc(16.5px + var(--step)); line-height:1.62; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:440px;margin:0 auto;padding:0 20px 56px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--persimmon);outline-offset:2px;border-radius:4px}
[hidden]{display:none !important}

/* ── 머리 ── */
.brand{display:block;width:190px;height:auto;margin:30px 0 0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 0 0}
.mark{font-family:"Gowun Batang",serif;font-weight:700;font-size:calc(32px + var(--step));
  line-height:1.16;letter-spacing:-.02em;margin:0}
.mark span{display:block;color:var(--pine)}
.zoom{flex:0 0 auto;margin-top:6px;color:var(--stone);font-size:calc(14px + var(--step));
  border:1px solid var(--line);border-radius:999px;padding:8px 13px;line-height:1.2}
.zoom b{color:var(--pine);font-weight:700}
.lede{margin:16px 0 0;color:var(--stone);font-size:calc(15.5px + var(--step))}
.switch{margin:10px 0 0;color:var(--pine);font-weight:700;font-size:calc(14.5px + var(--step));
  text-decoration:underline;text-underline-offset:3px}

/* ── 동 고르기 ── */
.pick{margin-top:30px;display:grid;gap:11px}
.pickbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:82px;padding:18px 20px;border:1.5px solid var(--line);border-radius:15px;
  text-align:left;font-weight:700;font-size:calc(20px + var(--step))}
.pickbtn em{display:block;font-style:normal;font-weight:400;color:var(--stone);
  font-size:calc(14px + var(--step));margin-top:3px}
.pickbtn:active{background:var(--mist);border-color:var(--pine)}
.pickbtn .arr{color:var(--stone);font-size:22px;font-weight:400}
.picknote{margin:22px 0 0;padding:16px;border-radius:12px;background:var(--mist);
  color:var(--stone);font-size:calc(14.5px + var(--step))}

/* ── 주 행동 ── */
.act{margin-top:24px;padding:22px;border-radius:16px;background:var(--pine);color:#fff}
.act h2{margin:0 0 6px;font-size:calc(19px + var(--step))}
.act p{margin:0 0 17px;font-size:calc(15px + var(--step));color:rgba(255,255,255,.82)}
.act .go{width:100%;min-height:58px;border-radius:12px;background:#fff;color:var(--pine);
  font-weight:700;font-size:calc(18px + var(--step))}
.act .go:active{background:var(--mist)}

/* ── 이런 경우 ── */
.cases{margin-top:28px}
.cases h2{margin:0 0 12px;font-size:calc(17px + var(--step));color:var(--stone);font-weight:700}
.cases ul{list-style:none;margin:0;padding:0}
.cases li{display:flex;align-items:center;gap:14px;padding:14px 0;
  border-top:1px solid var(--line);font-size:calc(16px + var(--step))}
.cases li:last-child{border-bottom:1px solid var(--line)}
.ic-case{width:26px;height:26px;color:var(--pine);background:var(--t-green);
  border-radius:50%;padding:8px;box-sizing:content-box}
.cases li:nth-child(2) .ic-case{background:var(--t-sand)}
.cases li:nth-child(3) .ic-case{background:var(--t-sky)}

/* ── 조용한 링크 줄 ── */
.rows{margin-top:22px}
.rows button,.rows a{display:flex;align-items:center;justify-content:space-between;width:100%;
  min-height:54px;color:var(--pine);font-weight:700;font-size:calc(16px + var(--step));
  border-bottom:1px solid var(--line);text-align:left;text-decoration:none}
.rows > *:first-child{border-top:1px solid var(--line)}
.rows button::after,.rows a::after{content:"›";color:var(--stone);font-size:20px;font-weight:400}

/* ── 위급 ── */
.sos{margin-top:22px;padding:18px;border-radius:14px;border:1.5px solid var(--persimmon)}
.sos p{margin:0 0 13px;font-size:calc(15.5px + var(--step))}
.sos b{color:var(--persimmon)}
.sos a{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:11px;
  background:var(--persimmon);color:#fff;font-weight:700;text-decoration:none;
  font-size:calc(18px + var(--step))}

/* ── 공통 버튼 ── */
.call{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;
  border-radius:12px;background:var(--pine);color:#fff;border:none;font-weight:700;
  text-decoration:none;font-size:calc(17.5px + var(--step))}
.call:active{background:var(--pine-dark)}
.call.ghost{background:#fff;color:var(--pine);border:1.5px solid var(--pine)}

/* ── 속 화면 ── */
.back{display:inline-flex;align-items:center;gap:6px;margin:26px 0 6px;min-height:44px;
  color:var(--pine);font-weight:700;font-size:calc(15.5px + var(--step))}
.head{font-family:"Gowun Batang",serif;font-size:calc(26px + var(--step));font-weight:700;margin:0}
.head-sub{color:var(--stone);margin:5px 0 22px;font-size:calc(14.5px + var(--step))}

/* ── 그림 ── */
svg.ic,svg[class^="ic-"]{fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
/* 색이 들어간 그림은 스스로 색을 가집니다 */
svg.il{flex:0 0 auto}
svg.il [stroke]{stroke-linecap:round;stroke-linejoin:round}

/* 그림을 감싸는 동그란 바탕 */
.tint{display:flex;align-items:center;justify-content:center;border-radius:50%;flex:0 0 auto}
.tint.g{background:var(--t-green)} .tint.s{background:var(--t-sand)}
.tint.b{background:var(--t-sky)}   .tint.r{background:var(--t-rose)}

/* ── 5단계 흐름 (장면 그림 카드) ── */
.flow{list-style:none;margin:0 0 26px;padding:0}
.flow li{border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px;
  background:#fff;box-shadow:0 1px 2px rgba(27,42,34,.04)}
.fart{padding:14px 14px 0}
.flow li:nth-child(1) .fart{background:var(--t-green)}
.flow li:nth-child(2) .fart{background:var(--t-sand)}
.flow li:nth-child(3) .fart{background:var(--t-sky)}
.flow li:nth-child(4) .fart{background:var(--t-rose)}
.flow li:nth-child(5) .fart{background:var(--t-sand)}
.art-flow{display:block;width:100%;height:auto}
.fart.photo{padding:0;background:none!important}
.fart.photo .art-flow{height:190px;object-fit:cover}
.ftxt{padding:16px 20px 20px}
.flow .stepno{display:block;color:var(--pine);font-weight:700;font-size:calc(14px + var(--step))}
.flow b{display:block;font-size:calc(19px + var(--step));line-height:1.34;margin-top:2px}
.flow em{display:block;font-style:normal;color:var(--stone);margin-top:6px;
  font-size:calc(15px + var(--step))}
.flow .mine{color:var(--persimmon);font-weight:700;font-size:calc(14px + var(--step));
  margin-top:8px;display:block}

/* ── 지원 활동 카드 ── */
.helps{display:grid;gap:12px;margin-bottom:26px}
.help{padding:22px;border:1px solid var(--line);border-radius:18px;background:#fff;
  box-shadow:0 1px 2px rgba(27,42,34,.04)}
.hbadge{width:76px;height:76px;margin-bottom:14px}
.ic-illus{width:50px;height:50px}
.hphoto{display:block;width:100%;height:160px;object-fit:cover;border-radius:12px;
  margin-bottom:14px;background:var(--mist)}
.help h3{margin:0 0 7px;font-size:calc(19px + var(--step));line-height:1.35}
.help p{margin:0;font-size:calc(15.5px + var(--step))}
.help ul{margin:11px 0 0;padding-left:19px;color:var(--stone);font-size:calc(15px + var(--step))}
.help li{margin-top:4px}
.help .who{display:inline-block;margin-top:12px;padding:4px 11px;border-radius:6px;
  background:var(--mist);color:var(--pine);font-weight:700;font-size:calc(13.5px + var(--step))}

/* ── 폼 ── */
.field{margin-bottom:24px}
.field > label{display:block;font-weight:700;font-size:calc(17px + var(--step));margin-bottom:4px}
.field .hint{display:block;color:var(--stone);font-size:calc(14px + var(--step));margin-bottom:11px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:15px;border:1px solid var(--line);
  border-radius:12px;cursor:pointer;font-size:calc(16px + var(--step))}
.opt input{margin:3px 0 0;width:21px;height:21px;accent-color:var(--pine);flex:0 0 21px}
.opt.sel{border-color:var(--pine);background:var(--mist)}
.opt em{display:block;font-style:normal;font-weight:400;color:var(--stone);
  font-size:calc(13.5px + var(--step));margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:11px 16px;border:1px solid var(--line);border-radius:999px;
  font-size:calc(15.5px + var(--step));min-height:46px}
.chip.sel{border-color:var(--pine);background:var(--pine);color:#fff;font-weight:700}
textarea,input[type=text]{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;
  background:#fff;font:inherit;color:var(--ink);resize:vertical}
textarea{min-height:130px}
.privacy{padding:16px;border-radius:12px;background:var(--mist);color:var(--stone);
  font-size:calc(14px + var(--step));margin-bottom:16px}
.privacy b{color:var(--ink)}
.privacy ul{margin:8px 0 0;padding-left:18px}
.privacy li{margin-top:5px}
.agree{display:flex;align-items:flex-start;gap:12px;font-size:calc(15.5px + var(--step));
  margin-bottom:22px;cursor:pointer}
.agree input{margin:3px 0 0;width:21px;height:21px;accent-color:var(--pine);flex:0 0 21px}
.err{color:var(--persimmon);font-weight:700;margin:0 0 18px;padding:15px 16px;
  border:1.5px solid var(--persimmon);border-radius:12px;background:#FBEEE5;
  font-size:calc(15.5px + var(--step));line-height:1.5}

/* ── 구역 제목 ── */
.part{margin:34px 0 3px;font-family:"Gowun Batang",serif;font-size:calc(21px + var(--step));
  font-weight:700;padding-bottom:10px;border-bottom:2px solid var(--pine)}
.part + .field,.part + .parthint{margin-top:18px}
.parthint{margin:0 0 16px;color:var(--stone);font-size:calc(14.5px + var(--step))}

/* ── 큰 네모 (추천 이유) ── */
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:9px;
  justify-content:flex-start;min-height:122px;padding:16px 14px;
  border:1.5px solid var(--line);border-radius:14px;text-align:left;line-height:1.32;
  font-weight:700;font-size:calc(15.5px + var(--step))}
.ic-box{width:26px;height:26px;color:var(--pine);background:var(--t-green);
  border-radius:50%;padding:8px;box-sizing:content-box}
.boxes .box:nth-child(4n+2) .ic-box{background:var(--t-sand)}
.boxes .box:nth-child(4n+3) .ic-box{background:var(--t-sky)}
.boxes .box:nth-child(4n+4) .ic-box{background:var(--t-rose)}
.box:active{background:var(--mist)}
.box.sel{border-color:var(--pine);background:var(--mist);padding-right:34px}
.box.sel::after{content:"✓";position:absolute;top:11px;right:12px;color:var(--pine);
  font-size:19px;font-weight:700}

/* ── 안내 화면 ── */
.signs{list-style:none;margin:0 0 26px;padding:0}
.signs li{display:flex;align-items:center;gap:17px;padding:16px 0;
  border-top:1px solid var(--line);font-size:calc(16px + var(--step))}
.signs li:last-child{border-bottom:1px solid var(--line)}
.sart{display:flex;align-items:center;justify-content:center;width:74px;height:74px;flex:0 0 74px;
  border-radius:50%;background:var(--t-green)}
.art-sign{width:56px;height:56px}
.sart.photo{background:none!important;overflow:hidden}
.sart.photo .art-sign{width:74px;height:74px;object-fit:cover;border-radius:50%}
.signs li:nth-child(4n+2) .sart{background:var(--t-sand)}
.signs li:nth-child(4n+3) .sart{background:var(--t-sky)}
.signs li:nth-child(4n+4) .sart{background:var(--t-rose)}
.signs b{display:block}
.signs em{font-style:normal;color:var(--stone);font-size:calc(14px + var(--step))}
.qa{margin-bottom:24px}
.qa h3{margin:0 0 5px;font-size:calc(16.5px + var(--step))}
.qa p{margin:0;color:var(--stone);font-size:calc(15px + var(--step))}
.note{padding:17px;border-radius:12px;background:var(--mist);font-size:calc(15px + var(--step));
  margin-bottom:24px}

/* ── 전화 접수 안내 ── */
.telbox{margin-top:16px;padding:18px;border-radius:14px;background:var(--mist)}
.telbox p{margin:0 0 13px;font-size:calc(15.5px + var(--step))}
.telbox .call{background:#fff}
.subnote{margin:14px 0 0;text-align:center;color:var(--stone);font-size:calc(15px + var(--step))}
.subnote a{color:var(--pine);text-decoration:none}

/* ── 동네 지도 ── */
.legend{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-wrap:wrap;gap:7px 16px}
.legend li{display:flex;align-items:center;gap:7px;color:var(--stone);font-size:calc(14px + var(--step))}
.ldot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.mapbox{border:1px solid var(--line);border-radius:13px;overflow:auto;background:#fff;
  -webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
.mapbox img{display:block;width:100%;height:auto}
.mapbox.big img{width:340%;max-width:none}
.mapcap{margin:14px 0 0;color:var(--stone);font-size:calc(14px + var(--step))}

/* ── 마침 ── */
.thanks{padding:34px 24px;text-align:center;background:var(--mist);border-radius:16px}
.thanks h2{font-family:"Gowun Batang",serif;font-size:calc(24px + var(--step));margin:0 0 12px}
.thanks p{margin:0 0 7px;color:var(--stone);font-size:calc(15.5px + var(--step))}

/* ── 설치 안내 ── */
.install{margin-top:28px;padding:24px;border-radius:18px;background:var(--mist);text-align:center}
.ibadge{width:86px;height:86px;margin:0 auto 16px;background:#fff}
.ibadge svg{width:56px;height:56px}
.install h2{margin:0 0 6px;font-size:calc(19px + var(--step));color:var(--ink)}
.install p{margin:0 0 18px;color:var(--stone);font-size:calc(15px + var(--step))}
.install button{width:100%;min-height:56px;border-radius:12px;background:var(--pine);
  color:#fff;font-weight:700;font-size:calc(17px + var(--step))}

/* ── 설치 화면 ── */
.tabs{display:flex;gap:8px;margin-bottom:24px;background:var(--mist);padding:6px;border-radius:14px}
.tab{flex:1;min-height:50px;border-radius:10px;font-weight:700;color:var(--stone);
  font-size:calc(15.5px + var(--step))}
.tab.on{background:#fff;color:var(--pine);box-shadow:0 1px 3px rgba(27,42,34,.1)}
.oneclick{padding:20px;border-radius:14px;border:1.5px solid var(--pine);margin-bottom:8px}
.oneclick p{margin:0 0 14px;font-size:calc(15.5px + var(--step))}
.steps{list-style:none;counter-reset:st;margin:0 0 24px;padding:0}
.steps li{position:relative;counter-increment:st;display:flex;align-items:center;gap:15px;
  padding:18px 18px 18px 54px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;
  font-size:calc(16px + var(--step));line-height:1.4}
.steps li::before{content:counter(st);position:absolute;left:16px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;background:var(--pine);color:#fff;font-weight:700;
  font-size:calc(14px + var(--step));display:flex;align-items:center;justify-content:center}
.sic{display:flex;align-items:center;justify-content:center;width:46px;height:46px;flex:0 0 46px;
  border-radius:12px;background:var(--mist)}
.point{text-align:center;margin:26px 0 8px}
.point svg{width:34px;height:50px}
.point p{margin:4px 0 0;color:var(--persimmon);font-weight:700;
  font-size:calc(15.5px + var(--step))}
@media (prefers-reduced-motion:no-preference){
  .point svg{animation:nudge 1.4s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
}

.foot{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);
  color:var(--stone);font-size:calc(13.5px + var(--step))}
.foot p{margin:0 0 5px}
@media (prefers-reduced-motion:no-preference){
  .view{animation:in .2s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap">
<main id="app"></main>

<script>
/* =======================================================================
   설정 — 여기만 고치시면 됩니다
   ======================================================================= */

/* 1) 접수 서버 주소 (네 개 동이 같은 서버를 씁니다) */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxk2CgAPbCkYbbovmVA9mahn7Io7ltRG3ss0ylbKQtJ-mRG4B0y6wGzBN_cAEf0fRk/exec";

/* 2) 동별 설정
      tel   : 그 동 담당자 직통번호
      dong  : 관할 주민센터 번호
      tongs : 통 목록 (실제 구성에 맞게 고치세요)
      map   : 주민들과 만든 동네지도 이미지 (없으면 "" — 지도 메뉴가 안 나옵니다)
      spots : 그 동에서 추천이 많이 들어오는 곳 (주민 안내용) */
const DONGS = [
  { id:"gileum1", name:"길음1동", tel:"02-6315-6408", dong:"02-2241-5110",
    tongs:["1통","2통","3통","4통","5통","6통","7통","8통","잘 모르겠어요"],
    map:"",
    spots:["SH임대단지", "소리마을 모아센터", "경로당 6개소", "고시원"] },

  { id:"gileum2", name:"길음2동", tel:"02-6315-6405", dong:"02-2241-5150",
    tongs:["1통","2통","3통","4통","5통","6통","7통","8통","잘 모르겠어요"],
    map:"",

      <input type="text" id="f-addr" value="${esc(r.addr)}" placeholder="예) ○○아파트 3동 502호 / ○○슈퍼 골목 안쪽">

  });
  app.querySelectorAll("[data-t]").forEach(el=>{
    el.onclick = ()=>{ sync(); r.tong = (r.tong===el.dataset.t) ? "" : el.dataset.t; reportView(null, true); };
  });
  app.querySelectorAll("[data-r]").forEach(el=>{
    el.onclick = ()=>{
      sync();
      const x = REASONS[+el.dataset.r].t;
      r.reasons = r.reasons.includes(x) ? r.reasons.filter(y=>y!==x) : r.reasons.concat([x]);
      reportView(null, true);
    };
  });
  const sb = document.getElementById("send");
  if (sb) sb.onclick = function(){ send(); };
}

function sync(){
  ["name","addr","tel","age","detail","reporter","reporterTel"].forEach(k=>{
    const e = document.getElementById("f-" + k);
    if (e) r[k] = e.value;
  });
  const a = document.getElementById("f-agree");
  if (a) r.agree = a.checked;
}

async function send(){
  sync();
  if (!r.name.trim() && !r.addr.trim())
    return reportView("성함이나 사시는 곳 중 하나는 알려주세요. 그래야 찾아뵐 수 있습니다.");
  if (!r.reasons.length)
    return reportView("추천하시는 이유를 하나 이상 골라 주세요.");
  if (!r.reporter.trim())
    return reportView("추천하신 분 성함을 적어 주세요.");
  if (!r.agree)
    return reportView("맨 아래 동의에 표시해 주세요.");
  if (!ENDPOINT)
    return reportView("아직 인터넷 접수 준비가 끝나지 않았습니다. 아래 번호로 전화 주시면 바로 받겠습니다.");

  const cs = CONSENTS.find(x=>x.id===r.consent);
  const 자료 = {
    dong:        D.name,
    name:        r.name.trim(),
    addr:        (D.name + " " + (r.tong ? r.tong + " " : "") + r.addr.trim()).trim(),
    tel:         r.tel.trim(),
    age:         r.age.trim(),
    consent:     cs ? cs.label : "",
    reasons:     r.reasons.join(" / "),
    detail:      r.detail.trim(),
    reporter:    r.reporter.trim(),
    reporterTel: r.reporterTel.trim()
  };

  const btn = document.getElementById("send");
  if (btn){ btn.textContent = "보내는 중…"; btn.disabled = true; }

  let 결과 = null;
  try {
    const res = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(자료),
      redirect: "follow"
    });
    결과 = await res.json();
  } catch (e) { 결과 = null; }

  if (!결과 || !결과.ok)
    return reportView("보내지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요. 계속 안 되면 아래 번호로 전화 주세요.");

  r = {name:"", addr:"", tel:"", age:"", consent:"", reasons:[], detail:"",
       tong:"", reporter:"", reporterTel:"", agree:false};
  shell(`
    <div class="thanks">
      <h2>접수되었습니다</h2>
      <p>${esc(D.name)} 담당자가 확인하겠습니다.</p>
      <p>${isOpenNow() ? "오늘 안에 확인합니다." : "다음 근무일에 확인합니다."}</p>
      <p style="margin-top:14px">어떤 조치가 이루어지는지 알려드리겠습니다.</p>
    </div>
    <button class="call ghost" id="hb" style="margin-top:22px">처음으로</button>
  `);
  document.getElementById("hb").onclick = function(){ home(); };
}

/* ── 시작 ───────────────────────────────────────────── */
const 저장된동 = 불러오기("dong");
D = DONGS.find(x => x.id === 저장된동) || null;
if (D) home(); else pickView();
</script>
</div>
</body>
</html>
